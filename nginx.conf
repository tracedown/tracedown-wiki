server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The installer lives in its own repository so it updates on merge with no
    # site rebuild; `curl -fsSL tracedown.dev/install.sh | bash` follows this.
    location = /install.sh {
        return 302 https://raw.githubusercontent.com/tracedown/tracedown-install/main/install.sh;
    }

    error_page 404 /404.html;
}
